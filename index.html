<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabbybyte Technologies</title>
  <base href="./">
  <base href="./">
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(to bottom, #fff 0%, #000 100%);
    }
    .slider-text {
      transition: opacity 0.5s;
    }
    .company-title {
      text-shadow: 0 2px 8px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.18);
    }
    .icon-link {
      position: relative;
      display: inline-block;
      transition: transform 0.2s ease-in-out;
    }
    .icon-link:hover {
      transform: scale(1.2);
    }
    .top-right-icons {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 1rem;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="top-right-icons">
    <!-- Github Icon -->
    <a href="https://github.com/tabbybyte-technologies" target="_blank" aria-label="GitHub" class="icon-link">
      <svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="#222">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.867 8.167 6.839 9.489.5.092.682-.217.682-.483 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.461-1.11-1.461-.908-.62.069-.608.069-.608 1.004.07 1.532 1.032 1.532 1.032.892 1.529 2.341 1.088 2.91.833.091-.646.35-1.088.636-1.339-2.221-.253-4.555-1.111-4.555-4.944 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.272.098-2.65 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.748-1.025 2.748-1.025.546 1.378.202 2.397.1 2.65.64.699 1.028 1.592 1.028 2.683 0 3.842-2.337 4.687-4.566 4.936.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.579.688.481C19.135 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
      </svg>
    </a>
    <!-- Email Icon -->
    <a href="mailto:hello.tabbybyte@gmail.com" aria-label="Email" class="icon-link">
      <svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="#222">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="3 7 12 13 21 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
  <div class="flex flex-col items-center justify-center w-full h-full">
    <!-- Logo Row -->
    <div class="mb-3">
      <div class="w-60 h-60 flex items-center justify-center">
        <img src="logo.png" alt="Tabbybyte Logo" class="w-60 h-60 object-contain" />
      </div>
    </div>
    <!-- Company Name Row -->
    <div class="mb-6">
      <h1 class="text-5xl font-black text-gray-900 text-center company-title" style="font-family: 'Alegreya', serif; letter-spacing: -1px;">Tabbybyte Technologies</h1>
    </div>
    <!-- Tagline Slider Row -->
    <div class="mb-10 h-8 flex items-center">
      <span id="slider" class="slider-text text-2xl font-normal text-gray-400" style="font-family: 'Share Tech Mono', monospace;">Innovate. Integrate. Inspire.</span>
    </div>
  </div>
  <script>
    // Tagline slider logic
    const taglines = [
      "Playful by Design. Powered by AI.",
      "Building the future, byte by byte.",
      "Where ideas become technology."
    ];
    let idx = 0;
    const slider = document.getElementById('slider');
    setInterval(() => {
      slider.style.opacity = 0;
      setTimeout(() => {
        idx = (idx + 1) % taglines.length;
        slider.textContent = taglines[idx];
        slider.style.opacity = 1;
      }, 500);
    }, 2500);
  </script>
</body>
</html>
